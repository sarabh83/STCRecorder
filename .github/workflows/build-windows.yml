name: Build Windows installer
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Starecorder-Setup
          path: dist/*.exe
          if-no-files-found: error
